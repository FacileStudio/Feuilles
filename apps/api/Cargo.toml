[package]
name = "api"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["http", "health", "spa", "migrate", "journal", "apiref", "mcp"] }
porte = { git = "https://github.com/FacileStudio/porte-rs", tag = "v0.8.1", features = ["oidc", "pg", "directory", "spaces", "mcp"] }
ironcalc = "=0.9.1"
async-trait = "0.1.92"
csv = "1.4.0"
encoding_rs = "0.8.44"
schemars = { version = "1.2.3", features = ["uuid1"] }
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "derive", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tungstenite = { version = "0.29.0", default-features = false }
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["testdb", "mcptest"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.dev.package.ironcalc_base]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
